name: OSS source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static security and packaging checks
        run: python3 scripts/check_snapshot.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find clientes demo -type f -name '*.js' -print0)
      - name: Check demo assets exist
        run: |
          test -f demo/index.html
          test -f demo/styles.css
          test -f demo/app.js
